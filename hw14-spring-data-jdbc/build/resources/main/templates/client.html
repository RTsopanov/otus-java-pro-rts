<!DOCTYPE html>
<html lang="ru"
      xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1">

    <title>Клиент</title>

    <link rel="stylesheet"
          href="/static/style.css">

</head>

<body>

<main class="container">

    <h1>Информация о клиенте</h1>

    <section class="card">

        <table>

            <tr>
                <th>ID</th>
                <td th:text="${client.id}">
                    1
                </td>
            </tr>

            <tr>
                <th>Имя</th>
                <td th:text="${client.name}">
                    Иван Иванов
                </td>
            </tr>

            <tr>
                <th>Адрес</th>
                <td
                        th:if="${client.address != null}"
                        th:text="${client.address.street}">
                    Ленина 10
                </td>

                <td th:unless="${client.address != null}">
                    Не указан
                </td>
            </tr>

            <tr>
                <th>Телефоны</th>

                <td>

                    <ul>

                        <li
                                th:each="phone : ${client.phones}"
                                th:text="${phone.number}">
                            +79999999999
                        </li>

                    </ul>

                </td>

            </tr>

        </table>

    </section>

    <p>

        <a
                th:href="@{/admin/clients/{id}/edit(id=${client.id})}">
            Изменить
        </a>

        |

        <a href="/admin/clients">
            ← К списку клиентов
        </a>

    </p>

</main>

</body>

</html>
